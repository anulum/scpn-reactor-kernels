# SCPN Reactor Kernels — dependency update automation
#
# Covers only ecosystems that exist in this repository: the pinned Python
# validation toolchain and pinned GitHub Actions. Updates cannot bypass the
# local gate sequence; every update lands through the normal review gates.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
