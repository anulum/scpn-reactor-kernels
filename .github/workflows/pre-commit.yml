# SCPN Reactor Kernels — pre-commit parity gate

name: Pre-commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Exact repository pre-commit parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Build the pinned repository virtual environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Run pre-commit on all files
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
