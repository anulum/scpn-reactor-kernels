# SCPN Reactor Kernels — static analysis and repository policy (reusable)

name: Static analysis and policy

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Lint, typing, kernel policy, workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy strict
        run: mypy --strict src tools tests benchmarks
      - name: Kernel manifest
        run: python tools/validate_kernels_domain.py kernels-domain.json
      - name: Kernel inventory drift
        run: python tools/generate_kernel_inventory.py --check
      - name: Workflow modularity guard
        run: python tools/audit_workflows.py
