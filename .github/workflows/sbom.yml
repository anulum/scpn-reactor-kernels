# SCPN Reactor Kernels — software inventory (no release)

name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: CycloneDX inventory of the pinned toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Generate CycloneDX SBOM for the development toolchain
        run: |
          python -m pip install --require-hashes -r requirements-audit.txt
          cyclonedx-py requirements requirements-dev.txt --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
