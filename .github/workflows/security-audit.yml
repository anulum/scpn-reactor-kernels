# SCPN Reactor Kernels — secrets, dependency, licence, and workflow policy

name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secrets, dependencies, licences, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Install audit tooling (Go module checksums verify the binaries)
        run: |
          python -m pip install --require-hashes -r requirements-audit.txt
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Secret scan
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner --redact
      - name: Dependency vulnerability audit
        run: pip-audit --disable-pip -r requirements-dev.txt -r requirements-cad.txt -r requirements-audit.txt
      - name: Licensing compliance
        run: reuse lint
      - name: Workflow policy lint
        run: |
          "$(go env GOPATH)/bin/actionlint"
