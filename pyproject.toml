# SCPN Reactor Kernels — package and validation tooling configuration

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scpn-reactor-kernels"
description = "Shared physics and geometry kernels of the SCPN Reactor Systems Research Group"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["version"]

# The CAD kernel group (tier G2) sits behind an optional extra: the pinned
# third-party B-rep kernel (CadQuery/OCP) and the volume mesher (gmsh).
[project.optional-dependencies]
cad = [
    "cadquery==2.8.0",
    "gmsh==4.15.2",
]

[tool.setuptools.dynamic]
version = { attr = "scpn_reactor_kernels.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scpn_reactor_kernels = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# The provenance header intentionally uses an en dash in the copyright range.
allowed-confusables = ["–"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "SIM", # simplification
    "ARG", # unused arguments
    "PTH", # pathlib usage
    "RUF", # ruff-specific
    "S",   # bandit-class security rules
    "PL",  # pylint
    "PERF",# performance anti-patterns
    "FBT", # boolean traps
    "ISC", # implicit string concatenation
    "PT",  # pytest style
    "RET", # return simplification
    "SLF", # private member access
    "DTZ", # naive datetimes
    "PIE", # misc lints
    "C90", # mccabe complexity
    "FURB",# modernisation
    "LOG", # logging defects
    "G",   # logging format
    "YTT", # sys.version misuse
    "EXE", # shebang and executable bits
    "ICN", # import conventions
    "INT", # gettext
    "TID", # tidy imports
    "FLY", # static join
    "NPY", # numpy legacy
    "Q",   # quote consistency
    "TRY", # exception anti-patterns
    "ANN", # missing annotations
]
# Rules deliberately NOT adopted, each with the reason it is wrong here
# rather than merely inconvenient. A rule that is silenced without a reason
# is debt; a rule that is silenced with one is a decision.
ignore = [
    # TRY003 demands short, generic exception messages. Every refusal in this
    # library deliberately names the offending field and its value, because
    # that message is load-bearing evidence for the caller. Adopting TRY003
    # would degrade exactly what the validation discipline exists to produce.
    "TRY003",
    # TRY004 asks for TypeError when an isinstance check fails. The group's
    # convention is that a rejected input raises a domain error naming the
    # field, never a builtin type error; honouring TRY004 in the two places
    # it fires would make the codebase less consistent, not more.
    "TRY004",
    # ANN401 forbids `Any`. The CAD group wraps a third-party kernel that
    # ships no type information, so `Any` is the honest annotation for a
    # back-end shape; a narrower lie would be worse.
    "ANN401",
    # PLR2004 flags comparisons against small integers. Here they are tuple
    # arities (a pair has two entries, a triangle three), and naming them
    # would obscure rather than explain.
    "PLR2004",
    # PLC0415 forbids imports inside functions. The CAD back-end is loaded
    # lazily on purpose (ADR 0006) and the benchmarks import their subject
    # after the timer setup on purpose; both are design decisions.
    "PLC0415",
    # PERF401 rewrites a filtered append loop into list.extend. Where it
    # fires, the loop body builds a multi-line message and the comprehension
    # form is less readable for no measurable gain on three iterations.
    "PERF401",
    # TC001/TC002/TC003 move imports under TYPE_CHECKING. The runtime needs
    # several of these annotations (dataclass field resolution), so the move
    # trades a real risk for no benefit at this size.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.mccabe]
# Ratchet at the current ceiling: passes today, forbids anything worse.
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 7
# Same ratchet for the two structural counters: the manifest validators and
# the workflow auditor legitimately test many independent fields in sequence,
# and splitting them would scatter one contract across several functions.
max-branches = 16
max-statements = 52

[tool.ruff.lint.per-file-ignores]
# assert is the pytest contract surface; the accuracy and parity sweeps use
# seeded standard pseudo-random grids (deterministic, not cryptographic)
"tests/*" = ["S101", "S311"]
# these two tests exist to prove that a boolean is refused as a count, so
# passing a boolean positionally IS the test (scope of FBT003)
"tests/test_geometry_trig.py" = ["S101", "S311", "FBT003"]
# preflight executes fixed argument vectors of repository gates without a
# shell and without untrusted input (scope of S603/S607)
"tools/preflight.py" = ["S603", "S607"]
# the benchmark records the commit with a fixed git argument vector resolved
# through shutil.which, without a shell and without untrusted input
"benchmarks/geometry_tessellation.py" = ["S603"]
"benchmarks/transcendental.py" = ["S603"]
"benchmarks/bessel.py" = ["S603"]
"benchmarks/cad.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "scpn_reactor_kernels",
    "check_commit_trailers",
    "manifest_io",
    "validate_kernels_domain",
    "generate_kernel_inventory",
    "preflight",
    "geometry_fixtures",
    "cad_fixtures",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
pretty = true
mypy_path = ["tools", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["tools", "src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
