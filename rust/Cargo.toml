# SCPN Reactor Kernels — native kernels

[package]
name = "scpn-reactor-kernels-rs"
version = "1.0.0-dev.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Native kernels of SCPN Reactor Kernels, bit-exact with the Python floor"
publish = false

[lib]
name = "scpn_reactor_kernels_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[lints.rust]
# Every public item of a native surface carries rustdoc. A binding that
# ships without documentation is debt the next reader pays, so it does not
# ship: the gate is the compiler's, not a review habit.
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
