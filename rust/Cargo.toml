# SCPN Reactor Kernels — native kernels

[package]
name = "scpn-reactor-kernels-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Native kernels of SCPN Reactor Kernels, bit-exact with the Python floor"
publish = false

[lib]
name = "scpn_reactor_kernels_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
