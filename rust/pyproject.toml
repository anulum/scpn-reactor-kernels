# SCPN Reactor Kernels — optional native extension build (maturin)

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "scpn-reactor-kernels-native"
version = "2.0.0.dev0"
description = "Optional native kernels of SCPN Reactor Kernels (bit-exact with the pure-Python floor)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

[tool.maturin]
features = ["python"]
module-name = "scpn_reactor_kernels_native"
